[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qresearch"
version = "0.1.0"
description = "Causal, lossless market-quote research foundations"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy", "pandas>=2", "pyarrow"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
